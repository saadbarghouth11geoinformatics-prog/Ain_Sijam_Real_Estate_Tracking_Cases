<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <!-- Brand Favicon: Eye + Location Pin + Skyline Towers -->
  <!-- Background circle/squircle -->
  <rect width="64" height="64" rx="14" fill="#0A3254" />
  
  <!-- Navy Blue Eye contour with white contrast outline -->
  <path 
    d="M 6 32 C 14 18, 50 18, 58 32 C 50 46, 14 46, 6 32 Z" 
    fill="#0A3254" 
    stroke="#046A58" 
    stroke-width="1.5" 
  />

  <!-- Emerald Green Pin Silhouette -->
  <path 
    d="M 32 10 
       C 43 10, 52 19, 52 30 
       C 52 39, 41 50, 32 58 
       C 23 50, 12 39, 12 30 
       C 12 19, 21 10, 32 10 Z" 
    fill="#046A58" 
  />

  <!-- Cutout Ring inside Pin -->
  <circle cx="32" cy="29" r="13" fill="#0A3254" />

  <!-- 3 Towers inside Ring -->
  <!-- Left Green Tower -->
  <path d="M 23 38 L 23 30 L 27 26 L 27 38 Z" fill="#046A58" />
  <!-- Center Deep Navy / White highlighted Tower -->
  <path d="M 29 38 L 29 23 L 32 20 L 35 23 L 35 38 Z" fill="#FFFFFF" />
  <!-- Right Gold Tower -->
  <path d="M 37 38 L 37 28 L 41 31 L 41 38 Z" fill="#BFA16F" />
</svg>
